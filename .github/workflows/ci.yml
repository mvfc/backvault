name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_HUB_IMAGE_NAME: mvflc/backvault

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsqlcipher-dev libssl-dev
        
      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libsqlite3-dev libsqlcipher-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    name: Docker Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set platform slug
        id: platform-slug
        run: |
          PLATFORM="${{ matrix.platform }}"
          echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ matrix.platform }}
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test
          cache-from: type=gha,scope=build-${{ steps.platform-slug.outputs.slug }}
          cache-to: type=gha,scope=build-${{ steps.platform-slug.outputs.slug }},mode=max

      - name: Verify Bitwarden CLI
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            bw --version

      - name: Verify supercronic
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            supercronic --version

      - name: Verify Python
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            python3 --version

      - name: Verify entrypoint is executable
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            test -x /app/entrypoint.sh

      - name: Verify run script is executable
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            test -x /app/run.sh

      - name: Verify required directories exist
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            sh -c 'test -d /app/backups && test -d /app/db && test -d /app/logs'

      - name: Verify custom PGID=100 (existing group 'users')
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PGID=100 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            id | grep -q 'gid=100(users)'

      - name: Verify custom PUID and PGID (new group)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PUID=1001 -e PGID=2000 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            id | grep -q 'uid=1001(appuser) gid=2000(appgroup)'

      - name: Verify recovery from missing appuser with PGID=100
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /bin/sh \
            -e PUID=1000 -e PGID=100 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            -c 'deluser appuser >/dev/null 2>&1 || true; exec /app/entrypoint.sh id' | grep -q 'uid=1000(appuser) gid=100(users)'

      - name: Verify recovery from missing appuser with custom PUID and PGID
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} --entrypoint /bin/sh \
            -e PUID=1001 -e PGID=2000 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            -c 'deluser appuser >/dev/null 2>&1 || true; exec /app/entrypoint.sh id' | grep -q 'uid=1001(appuser) gid=2000(appgroup)'

      - name: Verify root execution with PUID=0 and PGID=0
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PUID=0 -e PGID=0 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            id | grep -q 'uid=0(root) gid=0(root)'

      - name: Verify zero-padded PUID and PGID normalization
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PUID=01001 -e PGID=02000 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            id | grep -q 'uid=1001(appuser) gid=2000(appgroup)'

      - name: Verify bw execution under custom PUID/PGID
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PUID=1001 -e PGID=2000 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            bw --version

      - name: Verify bw execution under existing account PUID/PGID
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PUID=2 -e PGID=2 \
            ${{ env.IMAGE_NAME }}:${{ steps.platform-slug.outputs.slug }}-test \
            bw --version

  e2e:
    needs: [docker-build, lint, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  docker-push:
    name: Docker Push
    needs: [docker-build, lint, unit-tests, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:test
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.DOCKER_HUB_IMAGE_NAME }}:test
            ${{ env.DOCKER_HUB_IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=publish-multiarch
          cache-to: type=gha,scope=publish-multiarch,mode=max

      - name: Clean up test tags on Docker Hub
        if: always()
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Logging in to Docker Hub API to delete test tags..."
            LOGIN_RESP=$(jq -n \
              '{username: env.DOCKERHUB_USERNAME, password: env.DOCKERHUB_TOKEN}' | \
              curl -s -f -X POST \
                -H "Content-Type: application/json" \
                -d @- \
                https://hub.docker.com/v2/users/login || true)
            TOKEN=$(echo "$LOGIN_RESP" | jq -r .token 2>/dev/null || true)
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              for TAG in "test" "sha-${COMMIT_SHA}"; do
                echo "Deleting Docker Hub tag: $TAG..."
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: JWT $TOKEN" \
                  "https://hub.docker.com/v2/repositories/${DOCKER_HUB_IMAGE}/tags/${TAG}/" || true)
                echo "Docker Hub tag '$TAG' deletion response: $HTTP_CODE"
              done
            else
              echo "Failed to authenticate with Docker Hub API"
            fi
          else
            echo "Docker Hub credentials not configured; skipping tag cleanup"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_HUB_IMAGE: ${{ env.DOCKER_HUB_IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}

      - name: Clean up test tags on GitHub Container Registry (ghcr.io)
        if: always()
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          token = os.environ.get("GH_TOKEN")
          repo = os.environ.get("IMAGE_NAME")
          sha = os.environ.get("GITHUB_SHA", "")

          if not token:
              print("No GitHub token available for GHCR cleanup")
              exit(0)
          if not repo or "/" not in repo:
              print("Invalid IMAGE_NAME; skipping GHCR cleanup")
              exit(0)

          owner, package_name = repo.split("/", 1)
          package_name = package_name.lower()
          tags_to_delete = {"test"}
          if sha:
              tags_to_delete.add(f"sha-{sha}")

          print(f"Target tags for GHCR cleanup on package '{package_name}': {tags_to_delete}")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          endpoints = [
              f"https://api.github.com/orgs/{owner}/packages/container/{package_name}/versions",
              f"https://api.github.com/users/{owner}/packages/container/{package_name}/versions",
          ]

          def parse_next_link(link_header):
              if not link_header:
                  return None
              for part in link_header.split(","):
                  match = re.match(r'<([^>]+)>;\s*rel="([^"]+)"', part.strip())
                  if match and match.group(2) == "next":
                      return match.group(1)
              return None

          all_versions = []
          matched_endpoint = None

          for ep in endpoints:
              next_url = f"{ep}?per_page=100"
              ep_versions = []
              success = False
              while next_url:
                  req = urllib.request.Request(next_url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())
                          ep_versions.extend(data)
                          success = True
                          next_url = parse_next_link(resp.headers.get("Link"))
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 404):
                          break
                      print(f"Error querying {next_url}: {e}")
                      break
                  except Exception as e:
                      print(f"Error querying {next_url}: {e}")
                      break
              if success:
                  all_versions = ep_versions
                  matched_endpoint = ep
                  break

          if not matched_endpoint:
              print(f"Could not retrieve package versions for {repo} (check token permissions: delete:packages required)")
              exit(0)

          deleted_versions = set()
          for v in all_versions:
              v_id = v.get("id")
              tags = v.get("metadata", {}).get("container", {}).get("tags", [])
              tags_set = set(tags)
              matched_tags = tags_to_delete.intersection(tags_set)
              if matched_tags and v_id not in deleted_versions:
                  # Only delete the version if ALL of its tags are in tags_to_delete.
                  # If the version has tags outside tags_to_delete (e.g. latest, release), skip it.
                  other_tags = tags_set - tags_to_delete
                  if other_tags:
                      print(f"Skipping GHCR package version {v_id} because it has non-test tags: {other_tags}")
                      continue

                  del_url = f"{matched_endpoint}/{v_id}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req) as del_resp:
                          print(f"Successfully deleted GHCR package version {v_id} with tags {matched_tags} (HTTP {del_resp.status})")
                          deleted_versions.add(v_id)
                  except urllib.error.HTTPError as e:
                      print(f"Failed to delete GHCR version {v_id} (HTTP {e.code}): {e.reason}")
                      if e.code == 403:
                          print("Note: Deleting container package versions requires a token with 'delete:packages' scope (PAT or GitHub App).")
                  except Exception as e:
                      print(f"Error deleting GHCR version {v_id}: {e}")

          if not deleted_versions:
              print(f"No eligible GHCR versions found to delete for tags: {tags_to_delete}")
          EOF
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_SHA: ${{ github.sha }}
