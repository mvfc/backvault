name: E2E Tests
permissions:
  contents: read
  actions: read

on:
  workflow_call:
  pull_request:
    paths:
      - 'tests/**'
      - '.github/workflows/e2e.yml'
      - 'src/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'run.sh'
      - 'cleanup.sh'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/mvflc/backvault
  VAULTWARDEN_PORT: '8888'
  VAULTWARDEN_URL: http://localhost:8888

jobs:
  e2e:
    name: E2E Tests
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      vaultwarden:
        image: vaultwarden/server:latest
        env:
          SIGNUPS_ALLOWED: "true"
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          I_REALLY_WANT_VOLATILE_STORAGE: "true"
        options: >-
          --health-cmd "curl -f http://localhost/api/config || exit 1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 8888:80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@5927c834f5b4fdf503fca6f4c7eccda82949e1ee # v3.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Cleanup appgroup
        run: |
          sudo delgroup appgroup 2>/dev/null || true
          sudo deluser appuser 2>/dev/null || true

      - name: Validate ADMIN_TOKEN
        id: validate_token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN secret not set; skipping E2E tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build test image
        if: steps.validate_token.outputs.skip != 'true'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for Vaultwarden
        if: steps.validate_token.outputs.skip != 'true'
        run: |
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' -L "http://localhost:8888/api/config" 2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Vaultwarden is ready (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/30: Waiting... (HTTP $HTTP_CODE)"
            sleep 2
          done
          echo "Error: Vaultwarden failed to start"
          exit 1

      - name: Verify Vaultwarden is running
        if: steps.validate_token.outputs.skip != 'true'
        run: |
          HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' -L "http://localhost:8888/api/config" 2>/dev/null)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: Vaultwarden health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Vaultwarden health check passed"

      - name: Set up Python
        if: steps.validate_token.outputs.skip != 'true'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        if: steps.validate_token.outputs.skip != 'true'
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'

      - name: Install system dependencies
        if: steps.validate_token.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsqlcipher-dev libssl-dev

      - name: Install Bitwarden CLI
        if: steps.validate_token.outputs.skip != 'true'
        run: |
          npm install -g @bitwarden/cli@2025.10.0

      - name: Install dependencies
        if: steps.validate_token.outputs.skip != 'true'
        run: |
          pip install uv
          uv sync --dev

      - name: Run E2E tests
        if: steps.validate_token.outputs.skip != 'true'
        env:
          VAULTWARDEN_URL: ${{ env.VAULTWARDEN_URL }}
          VAULTWARDEN_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BW_TEST_EMAIL: ${{ secrets.BW_TEST_EMAIL || 'e2e@test.com' }}
          BW_TEST_PASSWORD: ${{ secrets.BW_TEST_PASSWORD || 'Test123!' }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}:test
        run: uv run pytest tests/test_e2e.py -v -m e2e -o "addopts="

      - name: Cleanup Docker buildx
        if: always()
        run: |
          docker buildx prune --all -f 2>/dev/null || true
